# The self-hosted Miblo relay behind Caddy (automatic HTTPS with Let's Encrypt).
#
#   1. Point a DNS name at this machine (an A/AAAA record), ports 80 and 443 open.
#   2. cp .env.example .env and set RELAY_DOMAIN (and RELAY_VAPID_SUBJECT).
#   3. docker compose up -d --build
#   4. docker compose logs relay   -> the setup token and the identity fingerprint
#
# The relay keeps its database in the relay-data volume (back it up) and its secrets in
# relay-secrets (keep that out of backups others can read).
services:
  relay:
    build:
      context: ../..
    image: miblo-relay:local
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      # Only connections from the private network below (Caddy) may name the client in
      # X-Forwarded-For; the relay's port is not published.
      TRUSTED_PROXY: 172.30.247.0/24
      RELAY_VAPID_SUBJECT: ${RELAY_VAPID_SUBJECT:-}
    volumes:
      - relay-data:/data
      - relay-secrets:/secrets
    networks:
      - relay
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    networks:
      - relay
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  relay:
    ipam:
      config:
        - subnet: 172.30.247.0/24

volumes:
  relay-data:
  relay-secrets:
  caddy-data:
  caddy-config:
